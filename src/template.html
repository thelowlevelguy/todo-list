<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Todo List</title>
</head>
<body>
	<header>
		<div id="header_logo">
			<div id="header_logo-block">
				<img id="header_logo-image" src="assets/images/mindcraft_logo.png">
			</div>
			<div id="header_logo-name">Work'Up</div>
		</div>
		<div id="header_search">
			<input type="text" name="search" id="header_search_input">
			<img id="header_search-icon" src="assets/icons/header-icons/search.svg">
		</div>
		<div id="header_add">
			<div>Add Item</div>
			<img id="header_add-icon" src="assets/icons/header-icons/add.svg">
		</div>
	</header>
	<div id="content">
		<div id="nav-section">
			<div class="nav-section-boxes"></div>
			<div class="nav-section-subjects"></div>
		</div>
		<div id="todo-content">
			<div class="todo-content-subject"></div>
			<div class="todo-content-projects"></div>
		</div>
	</div>
	
<script src="./index.js" type="module"></script>
</body>
</html>
