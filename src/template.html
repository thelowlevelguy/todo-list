<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Todo List</title>
</head>

	<div id="content">		
		<div class="header">
			<div id="header_logo">

				<div id="header_logo-name">Work'Up</div>
			</div>
		</div>
		<div class="sidebar">
			<div id="sidebar-overview">
				<div id="sidebar-overview-title">overwiew</div>

				</div>
			</div>

				<div id="sidebar-project-content">

				</div>
			</div>
		</div>
		<div class="section">
		 <div id="dialog-section"></div>
		 <div id="project-todos-section"></div>
			
		</div>
		<div class="footer">
			
		</div>

<script src="./index.js" type="module"></script>
